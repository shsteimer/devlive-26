version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /workers/cdn
    schedule:
      interval: weekly
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
